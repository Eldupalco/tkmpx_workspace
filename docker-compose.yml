services:
  postgres:
    image: postgres:17
    container_name: nestjs_prisma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@2020"
      POSTGRES_DB: tkpex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tkpex" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
